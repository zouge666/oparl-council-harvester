name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install python and packages
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -v
